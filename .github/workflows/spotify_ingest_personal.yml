name: Spotify Personal Ingestion Pipeline

on:
  schedule:
    # Chạy tự động ngầm mỗi 6 tiếng một lần (lúc 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Cho phép bấm nút "Run workflow" thủ công trên giao diện GitHub Actions bất cứ lúc nào
  workflow_dispatch:

jobs:
  ingest-spotify-personal:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Personal Spotify Ingestion Script
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python src/ingest_personal.py
